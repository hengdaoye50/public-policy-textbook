  <text x="59.0" y="46.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">公共视角</text>
  <text x="59.0" y="70.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">提问方式</text>
  <text x="59.0" y="83.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">这是不是公共问题？</text>
  <text x="59.0" y="94.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">谁的利益受影响？</text>
  <line x1="22.0" y1="102.0" x2="96.0" y2="102.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="59.0" y="112.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">核心判准</text>
  <text x="59.0" y="125.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">公共利益与公共性</text>
  <line x1="22.0" y1="136.0" x2="96.0" y2="136.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
