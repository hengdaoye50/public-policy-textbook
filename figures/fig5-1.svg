  <text x="335.0" y="125.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">正当性</text>
  <line x1="298.0" y1="136.0" x2="372.0" y2="136.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="335.0" y="146.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">典型主张</text>
  <text x="335.0" y="159.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">有些事无论多有效</text>
  <text x="335.0" y="170.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">都不该做</text>
  <line x1="298.0" y1="180.0" x2="372.0" y2="180.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="335.0" y="190.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">盲　　区</text>
