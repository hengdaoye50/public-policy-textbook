  <rect x="108.0" y="30.0" width="86.0" height="192.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
  <rect x="108.0" y="30.0" width="86.0" height="24.0" rx="0" fill="#E4EAF1" stroke="#1A3A5C" stroke-width="1.4"/>
  <text x="151.0" y="46.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">政治视角</text>
  <text x="151.0" y="70.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">提问方式</text>
  <text x="151.0" y="83.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">谁支持、谁反对？</text>
  <text x="151.0" y="94.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">可行性如何？</text>
  <line x1="114.0" y1="102.0" x2="188.0" y2="102.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="151.0" y="112.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">核心判准</text>
  <text x="151.0" y="125.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">权力的可通行性</text>
  <line x1="114.0" y1="136.0" x2="188.0" y2="136.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="151.0" y="146.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">典型主张</text>
  <text x="151.0" y="159.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">能通过的就是好方案</text>
  <line x1="114.0" y1="180.0" x2="188.0" y2="180.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="151.0" y="190.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">盲　　区</text>
  <text x="151.0" y="203.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">把正当性等同于可行性</text>
