  <text x="243.0" y="125.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">效率</text>
  <line x1="206.0" y1="136.0" x2="280.0" y2="136.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="243.0" y="146.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">典型主张</text>
  <text x="243.0" y="159.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">让价格与竞争发挥作用</text>
  <line x1="206.0" y1="180.0" x2="280.0" y2="180.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
