  <text x="59.0" y="159.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">该政策应覆盖哪些人、</text>
  <text x="59.0" y="170.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">由谁承担</text>
  <line x1="22.0" y1="180.0" x2="96.0" y2="180.0" stroke="#333333" stroke-width="0.8" opacity="1.0"/>
  <text x="59.0" y="190.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">盲　　区</text>
  <text x="59.0" y="203.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#222222" text-anchor="middle" opacity="1.0">公共利益难以界定，</text>
