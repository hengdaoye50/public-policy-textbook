<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440pt" height="266pt" viewBox="0 0 440 266">
  <rect width="440" height="266" fill="#FFFFFF"/>
  <rect x="18.0" y="8.0" width="82.0" height="62.0" rx="0" fill="#F2F4F7" stroke="#333333" stroke-width="1.2"/>
  <text x="59.0" y="29.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">按利益分布</text>
  <text x="59.0" y="42.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#666666" text-anchor="middle" opacity="1.0">（洛维）</text>
  <text x="59.0" y="58.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">界定权集中或分散</text>
  <rect x="100.0" y="8.0" width="80.0" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="140.0" y="25.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">分配型问题</text>
  <text x="140.0" y="36.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">成本分散、收益集中</text>
  <text x="140.0" y="47.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">冲突温和</text>
  <text x="140.0" y="57.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 反对力量分散</text>
  <rect x="180.0" y="8.0" width="80.0" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="220.0" y="25.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">管制型问题</text>
  <text x="220.0" y="36.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">成本与收益均集中</text>
  <text x="220.0" y="47.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">利益集团对抗</text>
  <text x="220.0" y="57.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 对抗强度高</text>
  <rect x="260.0" y="8.0" width="80.0" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="300.0" y="25.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">再分配型问题</text>
  <text x="300.0" y="36.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">成本与收益分属</text>
  <text x="300.0" y="47.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">较大群体</text>
  <text x="300.0" y="57.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">沿阶层界线冲突</text>
  <text x="300.0" y="67.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 冲突规模大</text>
  <rect x="340.0" y="8.0" width="80.0" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="380.0" y="25.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">自我管制型问题</text>
  <text x="380.0" y="36.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">约束来自被约束者</text>
  <text x="380.0" y="47.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">界定在行业内部完成</text>
  <text x="380.0" y="57.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 界定权在业内</text>
  <rect x="18.0" y="82.0" width="82.0" height="62.0" rx="0" fill="#F2F4F7" stroke="#333333" stroke-width="1.2"/>
  <text x="59.0" y="103.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">按结构复杂度</text>
  <text x="59.0" y="116.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#666666" text-anchor="middle" opacity="1.0">（邓恩）</text>
  <rect x="100.0" y="82.0" width="106.7" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="153.3" y="99.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">结构优良</text>
  <text x="153.3" y="110.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">决策者少、价值一致</text>
  <text x="153.3" y="121.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">方案有限、结果可算</text>
  <text x="153.3" y="131.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 决策矩阵·敏感度分析</text>
  <rect x="206.7" y="82.0" width="106.7" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="260.0" y="99.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">结构适中</text>
  <text x="260.0" y="110.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">部分条件不满足</text>
  <text x="260.0" y="121.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">结果不确定</text>
  <text x="260.0" y="131.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 情景分析·博弈分析</text>
  <rect x="313.3" y="82.0" width="106.7" height="62.0" rx="0" fill="#E4EAF1" stroke="#1A3A5C" stroke-width="1.3"/>
  <text x="366.7" y="99.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#1A3A5C" text-anchor="middle" opacity="1.0">结构不良</text>
  <text x="366.7" y="110.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#1A3A5C" text-anchor="middle" opacity="1.0">四项条件均不满足</text>
  <text x="366.7" y="121.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#1A3A5C" text-anchor="middle" opacity="1.0">涉及多部门与价值排序</text>
  <text x="366.7" y="131.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#1A3A5C" text-anchor="middle" opacity="1.0">→ 多技术串接·留协商空间</text>
  <rect x="18.0" y="156.0" width="82.0" height="62.0" rx="0" fill="#F2F4F7" stroke="#333333" stroke-width="1.2"/>
  <text x="59.0" y="177.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">按规则层次</text>
  <text x="59.0" y="190.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#666666" text-anchor="middle" opacity="1.0">（制度分析传统）</text>
  <rect x="100.0" y="156.0" width="106.7" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="153.3" y="173.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">操作层</text>
  <text x="153.3" y="184.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">日常运作中显现</text>
  <text x="153.3" y="195.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">便于及时调整</text>
  <text x="153.3" y="205.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 重效率</text>
  <rect x="206.7" y="156.0" width="106.7" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="260.0" y="173.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">集体选择层</text>
  <text x="260.0" y="184.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">经集体审议纳入议程</text>
  <text x="260.0" y="195.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">涉及资源配置规则</text>
  <text x="260.0" y="205.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 重程序</text>
  <rect x="313.3" y="156.0" width="106.7" height="62.0" rx="0" fill="#FFFFFF" stroke="#333333" stroke-width="1.1"/>
  <text x="366.7" y="173.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">宪政层</text>
  <text x="366.7" y="184.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">涉及治理基本规则</text>
  <text x="366.7" y="195.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">影响下层如何界定</text>
  <text x="366.7" y="205.4" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.6" fill="#333333" text-anchor="middle" opacity="1.0">→ 重价值</text>
  <text x="220.0" y="240.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#222222" text-anchor="middle" opacity="1.0">三条标准的差别在于：看利益怎么分、看问题有多难、看规则在哪一层。三条标准可以交叉使用，同一个问题可以同</text>
  <text x="220.0" y="251.1" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#222222" text-anchor="middle" opacity="1.0">时是再分配型、结构不良与集体选择层次的问题。</text>
</svg>
