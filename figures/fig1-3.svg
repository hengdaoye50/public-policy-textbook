  <text x="220.0" y="201.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" fill="#222222" text-anchor="middle" opacity="1.0">洛维、索尔兹伯里按效果分布分类；安德森按内容形态分类；萨尔蒙按手段分类。</text>
  <text x="220.0" y="216.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="8" fill="#222222" text-anchor="middle" opacity="1.0">同一项政策可同时是再分配型、以补贴为工具并带有象征意义：分类是比较的尺子，不是唯一的标签。</text>
