  <text x="161.0" y="78.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">20世纪80年代公共服务</text>
  <text x="161.0" y="90.2" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">合同外包</text>
