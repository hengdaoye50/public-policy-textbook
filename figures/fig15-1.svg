  <text x="335.0" y="67.0" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">霍尔所研究的英国1976年</text>
  <text x="335.0" y="78.6" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">货币政策转向；郭俊华等</text>
  <text x="335.0" y="90.2" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">分析的残疾人集中就业政策</text>
  <text x="335.0" y="101.8" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">目标跳变</text>
  <text x="161.0" y="163.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="9.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">渐进调适</text>
  <text x="161.0" y="178.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">林德布洛姆的渐进主义；</text>
  <text x="161.0" y="190.2" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">中国价格改革双轨制并轨</text>
  <text x="335.0" y="163.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="9.4" font-weight="bold" fill="#222222" text-anchor="middle" opacity="1.0">渐进式范式漂移</text>
  <text x="335.0" y="178.7" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">中国从“社会管理”到</text>
  <text x="335.0" y="190.2" font-family="'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif" font-size="7.8" fill="#666666" text-anchor="middle" opacity="1.0">“社会治理”的表述演进</text>
