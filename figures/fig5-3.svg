  <defs><marker id="ah33" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path d="M0,0.6 L5.6,3 L0,5.4 z" fill="#333333"/></marker></defs>
  <line x1="216.0" y1="201.0" x2="234.0" y2="201.0" stroke="#333333" stroke-width="1.3" marker-end="url(#ah33)"/>
  <rect x="238.0" y="188.0" width="186.0" height="26.0" rx="0" fill="#FFFFFF" stroke="#1A3A5C" stroke-width="1.2"/>
